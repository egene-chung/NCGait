data_cfg:
  dataset_name: CASIA-B  # Evaluator key; the input data are CASIA-B* aligned silhouettes.
  dataset_root: ${data_root}/CASIA-B/casiab-128-end2end
  dataset_partition: ./datasets/CASIA-B/CASIA-B.json
  num_workers: 1
  data_in_use: [true, false, false, false]
  remove_no_gallery: false # Remove probe if no gallery for it
  test_dataset_name: CASIA-B

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 70000
  save_name: DeepGaitV2-ncb-pgfc-vm
  use_pgfc_fusion: false
  sampler:
    batch_shuffle: false
    batch_size: 2
    sample_type: all_ordered # all indicates whole sequence used to test, while ordered means input sequence by its natural order; Other options:   fixed_unordered
    frames_all_limit: 720 # limit the number of sampled frames to prevent out of memory
    type: InferenceSampler
  eval_func: evaluate_indoor_dataset
  metric: euc # cos
  transform:
    - type: BaseSilCuttingTransform

loss_cfg:
  - loss_term_weight: 1.0
    margin: 0.2
    type: TripletLoss
    log_prefix: triplet
    # neg_mining: strict_view_match_top1
    neg_mining: view_match_negative_mining
    vm_k_neg: 1
    vm_aux_weight: 0.2
    vm_primary_max_priority: 2
    vm_use_viewset: true
  - loss_term_weight: 1.0
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true

model_cfg:
  model: DeepGaitV2
  normalize_before_bn: true
  Backbone:
    mode: p3d
    in_channels: 1
    layers:
      - 1
      - 1
      - 1
      - 1
    channels:
      - 64
      - 128
      - 256
      - 512
  SeparateBNNecks:
    class_num: 74
  use_pgfc: true
  pgfc:
    groups: 4
    stats_axes: cg_only_partwise
    affine_type: group_part
    eps: 1.0e-4
    var_floor: 1.0e-4
    gate_type: bnneck
    stopgrad_gate_ctx: true
    gate_init_bias: -4.0
    g_max_init: 0.1
    g_max_final: 1.0
    g_max_ramp_iters: 5000
    use_mixstyle: false
    mix_p: 0.5
    mix_alpha: 0.1
    use_gate_reg: false
    gate_reg_target: 0.2
    gate_reg_weight: 1.0e-4

optimizer_cfg:
  lr: 0.1
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005

scheduler_cfg:
  gamma: 0.1
  milestones: # Learning Rate Reduction at each milestones
    - 20000
    - 40000
    - 50000
    - 60000
  scheduler: MultiStepLR

trainer_cfg:
  enable_float16: true # half_percesion float for memory reduction and speedup
  fix_BN: false
  log_iter: 100
  with_test: false
  restore_ckpt_strict: true
  optimizer_reset: false
  scheduler_reset: false
  restore_hint: 0
  save_iter: 10000
  save_name: DeepGaitV2-ncb-pgfc-vm
  sync_BN: true
  total_iter: 70000
  find_unused_parameters: false
  sampler:
    type: NCBSampler
    batch_size:
      - 8
      - 16
    batch_shuffle: true
    outfit_key_field: type
    min_views_per_outfit: 2
    V_shared: 4
    per_view_shots: 4
    select_per_view: 2
    n_outfit_blocks: 2
    deterministic_selection: true
    fallback_policy: partial_controlled_then_pk #coverage_top
    max_resample_trials: 10
    ensure_min_shared_coverage: 6
    log_batch_stats: false
    frames_num_fixed: 30 # fixed frames number for training
    frames_skip_num: 4
    sample_type: fixed_ordered # fixed control input frames number, unordered for controlling order of input tensor; Other options: unfixed_ordered or all_ordered
  transform:
    - type: Compose
      trf_cfg:
        - type: RandomPerspective
          prob: 0.2
        - type: BaseSilCuttingTransform
        - type: RandomHorizontalFlip
          prob: 0.2
        - type: RandomRotate
          prob: 0.2
