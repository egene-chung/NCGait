# ============================================
# Global Path Configuration
# ============================================

# Base directory that holds all processed datasets (required).
# Every config resolves its dataset_root as ${data_root}/<dataset>/..., e.g.
#   ${data_root}/CCPG/CCPG-end2end-pkl-refined
#   ${data_root}/SUSTech1K/SUSTech1K-Released-pkl
#   ${data_root}/CASIA-B/casiab-128-end2end
data_root:

# Base directory for output (checkpoints, logs, etc.)
# main.py and base_model.py use this value automatically.
# Falls back to ./output when left empty.
output_root: